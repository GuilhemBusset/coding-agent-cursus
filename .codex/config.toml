# Project-scoped Codex configuration — the Codex convenience layer that mirrors
# Claude Code's `.claude/settings.json`. Loaded only when the project is trusted,
# and each hook below must additionally be trusted once via /hooks (trust is
# per-hook-hash, so re-trust after any change to this file or the scripts).
#
# Per ADR 0002/0004, the protected-`main` *guarantee* lives at agent-independent
# layers (GitHub ruleset + `.githooks/*` + `pr-only.yml`); the hooks below are a
# thin convenience wrapper that points Codex at the same shared scripts Claude
# Code uses. Codex hooks fail OPEN (an erroring hook does not block the action),
# which is exactly why they are never the only line of defense.
#
# Hooks run in the *session* cwd, not the repo root, so each command resolves
# the repo root itself — a session started in a per-session subfolder (ADR 0001)
# still works.

# Activate the protected-main git hooks at session start — the Codex analog of
# Claude Code's SessionStart hook. Both call the one agent-neutral setup script,
# so `core.hooksPath -> .githooks` does not depend on any single agent.
[[hooks.SessionStart]]
matcher = "startup"

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash -c 'cd \"$(git rev-parse --show-toplevel)\" && bash scripts/setup.sh'"
status_message = "Activating protected-main git hooks"

# Fast in-loop block: refuse Bash commands that would commit on / push to a
# protected branch. Reuses the same shared guard Claude Code's PreToolUse hook
# runs — identical JSON payload in, exit-code-2 deny out. The declarative first
# line for common spellings lives in .codex/rules/protected-main.rules; this
# hook catches arbitrary forms (HEAD:main refspecs, --no-verify, ...).
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash -c 'cd \"$(git rev-parse --show-toplevel)\" && exec scripts/guard-main.sh'"
