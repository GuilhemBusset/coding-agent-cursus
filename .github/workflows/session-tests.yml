name: Session tests

# Called by ci.yml on every pull request; its result feeds the single required check. Runs
# each session's pytest suite (every sessions/<NN>-*/ with a tests/ folder) in that session's
# pinned environment: the Python and uv versions in its mise.toml and the packages in its
# uv.lock, with the command its README documents. The suite runs on every core through
# pytest-xdist, from the session's non-default `parallel` dependency group (students' `uv sync`
# never installs it). This is a Linux check of instructor-side
# work; exercise portability across Linux, macOS and Windows is a separate concern
# (docs/adr/0010-platform-support.md).
#
# A test that needs what CI lacks (a logged-in claude or codex CLI, network access to a vendor
# API, credentials, a real laptop, Windows or macOS) carries the `live` marker, registered in
# its session's [tool.pytest.ini_options] markers; `-m "not live"` deselects it here. It must
# never skip itself instead: a run with skipped tests fails below.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.find.outputs.sessions }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Sessions with a pytest suite
        run: |
          set -euo pipefail
          sessions="$(find sessions -mindepth 2 -maxdepth 2 -type d -name tests -printf '%h\n' | sort)"
          if [ -z "$sessions" ]; then
            echo "::error::No session has a tests/ folder; an empty run is not evidence"
            exit 1
          fi
          printf '%s\n' "$sessions"
          echo "sessions=$(jq -Rnc '[inputs]' <<<"$sessions")" >> "$GITHUB_OUTPUT"

  pytest:
    needs: discover
    name: pytest (${{ matrix.session }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.discover.outputs.sessions) }}
    defaults:
      run:
        working-directory: ${{ matrix.session }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read the session's pinned Python and uv
        env:
          SESSION: ${{ matrix.session }}
        run: |
          set -euo pipefail
          for f in pyproject.toml uv.lock mise.toml; do
            [ -f "$f" ] || { echo "::error file=$SESSION/$f::A session's tests run in its pinned environment; $f is missing"; exit 1; }
          done
          python3 - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              groups = tomllib.load(f).get("dependency-groups", {})
          if not any(str(dep).startswith("pytest-xdist") for dep in groups.get("parallel", [])):
              sys.exit(f"::error file={os.environ['SESSION']}/pyproject.toml::The session's tests run "
                       "in parallel; add pytest-xdist to a `parallel` dependency group "
                       "(uv add --group parallel pytest-xdist)")
          with open("mise.toml", "rb") as f:
              tools = tomllib.load(f)["tools"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"python={tools['python']}\nuv={tools['uv']}\n")
          print(f"python {tools['python']}, uv {tools['uv']}")
          EOF
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: pytest
        env:
          UV_PYTHON: ${{ steps.pins.outputs.python }}
        run: uv run --locked --group parallel pytest -q -m "not live" -n auto --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: Every collected test ran, none skipped
        run: |
          python3 - "$RUNNER_TEMP/pytest.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "skipped")}
          print(totals)
          if totals["tests"] == 0 or totals["skipped"]:
              sys.exit("Empty or skipped run. Exclude a test CI cannot run with the registered "
                       "`live` marker, never by skipping inside the test.")
          EOF
