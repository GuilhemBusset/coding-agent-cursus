name: Session tests

# Called by ci.yml; its result feeds the single required check. A session's pytest suite has two
# parts, each its own job: tests/lessons (what is taught live, cursus/) and tests/labs (what
# students run, exercises/). Each runs in the session's pinned environment: the Python and uv
# versions in its mise.toml and the packages in its uv.lock, on every core through pytest-xdist,
# from the session's non-default `parallel` dependency group (students' `uv sync` never installs
# it). Beside them, ty type-checks each session's Python with its pyproject.toml's [tool.ty], from
# its non-default `typecheck` group (ADR 0014). This is a Linux check of instructor-side work;
# exercise portability across Linux, macOS and Windows is a separate concern
# (docs/adr/0010-platform-support.md).
#
# A test that needs what CI lacks (a logged-in claude or codex CLI, network access to a vendor
# API, credentials, a real laptop, Windows or macOS) carries the `live` marker; `-m "not live"`
# deselects it here. It must never skip itself instead: a run with skipped tests fails below.
on:
  workflow_call:
    inputs:
      parts:
        description: JSON list of session test parts (sessions/<NN>-*/tests/<part>); empty runs every part
        type: string
        default: ''
      sessions:
        description: JSON list of sessions to type-check; empty checks every session with a tests/ folder
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

# A cache restore that GitHub throttles ("Egress is over the account limit") gives up after a
# minute and the job installs without it, instead of waiting the default 10 minutes.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.find.outputs.parts }}
      sessions: ${{ steps.find.outputs.sessions }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Session test parts
        env:
          PARTS: ${{ inputs.parts }}
          SESSIONS: ${{ inputs.sessions }}
        run: |
          set -euo pipefail
          # Every part folder holding a test file; ci.yml's selection must name existing ones.
          all="$(find sessions -mindepth 4 -maxdepth 4 -path 'sessions/*/tests/*' -name 'test_*.py' -printf '%h\n' | sort -u)"
          [ -n "$all" ] || { echo "::error::No session has a test part; an empty run is not evidence"; exit 1; }
          if [ -n "$PARTS$SESSIONS" ]; then
            parts="$(jq -r '.[]' <<<"${PARTS:-[]}" | sort)"
            missing="$(comm -23 <(printf '%s\n' "$parts" | sed '/^$/d') <(printf '%s\n' "$all"))"
            [ -z "$missing" ] || { echo "::error::Selected parts without tests: $missing"; exit 1; }
            sessions="$(jq -r '.[]' <<<"${SESSIONS:-[]}" | sort)"
          else
            parts="$all"
            sessions="$(printf '%s\n' "$all" | sed 's|/tests/.*||' | sort -u)"
          fi
          printf 'parts:\n%s\nsessions:\n%s\n' "$parts" "$sessions"
          echo "parts=$(printf '%s\n' "$parts" | sed '/^$/d' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "sessions=$(printf '%s\n' "$sessions" | sed '/^$/d' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  pytest:
    needs: discover
    if: needs.discover.outputs.parts != '[]'
    name: pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.discover.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - id: where
        name: The part's session and folder
        env:
          PART: ${{ matrix.part }}
        run: |
          echo "session=${PART%%/tests/*}" >> "$GITHUB_OUTPUT"
          echo "folder=tests/${PART#*/tests/}" >> "$GITHUB_OUTPUT"
      - id: pins
        name: Read the session's pinned Python and uv
        working-directory: ${{ steps.where.outputs.session }}
        env:
          SESSION: ${{ steps.where.outputs.session }}
        run: python3 ../../.github/scripts/session_pins.py
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: pytest
        working-directory: ${{ steps.where.outputs.session }}
        env:
          UV_PYTHON: ${{ steps.pins.outputs.python }}
          FOLDER: ${{ steps.where.outputs.folder }}
        run: uv run --locked --group parallel pytest -q -m "not live" -n auto --junitxml="$RUNNER_TEMP/pytest.xml" "$FOLDER"
      - name: Every collected test ran, none skipped
        run: |
          python3 - "$RUNNER_TEMP/pytest.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "skipped")}
          print(totals)
          if totals["tests"] == 0 or totals["skipped"]:
              sys.exit("Empty or skipped run. Exclude a test CI cannot run with the `live` marker, "
                       "never by skipping inside the test.")
          EOF

  types:
    needs: discover
    if: needs.discover.outputs.sessions != '[]'
    name: types (${{ matrix.session }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.discover.outputs.sessions) }}
    defaults:
      run:
        working-directory: ${{ matrix.session }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read the session's pinned Python and uv
        env:
          SESSION: ${{ matrix.session }}
        run: python3 ../../.github/scripts/session_pins.py
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
      # The whole session, then the exercises once per platform students use (ADR 0010):
      # `python-platform = "all"` checks every branch, but an API only one platform has is caught
      # only by checking as each of the others.
      - name: Type check
        env:
          UV_PYTHON: ${{ steps.pins.outputs.python }}
        run: |
          uv run --locked --group typecheck ty check
          for platform in linux darwin win32; do
            uv run --locked --group typecheck ty check --python-platform "$platform" exercises
          done
