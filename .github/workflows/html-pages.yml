name: HTML page tooling

# Called by ci.yml when a pull request touches HTML tooling or pages (ci.yml owns the
# path list, so this check can feed the always-present required check). Can also be
# run by hand from the Actions tab.
#
# The Node suites and the page checks are independent, so they run as separate jobs side by
# side: the suites in two shards (`node --test --test-shard`, which splits the sorted suite
# files round-robin), the 23 teaching pages in a third. The call fails if any job fails.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    # Teaching pages and their tooling only need Linux; exercises are the cross-platform
    # part of the repo (docs/adr/0010-platform-support.md).
    name: suites (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      # Playwright's browser download, keyed by the locked Playwright version. The setup below
      # still runs in full; it skips the download when the browser is already there.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('setup/package-lock.json') }}
      - name: Reproduce the documented Linux setup
        run: node setup/html-pages.mjs --with-system-deps
      - run: npm --prefix setup test -- --test-shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-page-review-suites-${{ matrix.shard }}
          path: artifacts/html-pages/
          retention-days: 7
          if-no-files-found: ignore

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('setup/package-lock.json') }}
      - name: Reproduce the documented Linux setup
        run: node setup/html-pages.mjs --with-system-deps
      - run: npm --prefix setup run check-repo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-page-review
          path: artifacts/html-pages/
          retention-days: 7
