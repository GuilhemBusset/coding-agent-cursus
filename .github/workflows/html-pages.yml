name: HTML page tooling

on:
  pull_request:
    paths:
      - 'tools/html-pages/**'
      - 'setup/**'
      - '.agents/skills/html-page/**'
      - '.claude/skills/html-page/**'
      - '.github/workflows/html-pages.yml'
      - 'docs/**/*.html'
      - 'docs/**/*.htm'
      - 'sessions/**/*.html'
      - 'sessions/**/*.htm'

permissions:
  contents: read

jobs:
  browser-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      - name: Reproduce the documented Linux setup
        if: runner.os == 'Linux'
        run: node setup/html-pages.mjs --with-system-deps
      - name: Reproduce the documented macOS and Windows setup
        if: runner.os != 'Linux'
        run: node setup/html-pages.mjs
      - run: npm --prefix setup test
      - run: npm --prefix setup run check-repo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-page-review-${{ matrix.os }}
          path: artifacts/html-pages/
          retention-days: 7
