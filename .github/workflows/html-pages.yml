name: HTML page tooling

# Called by ci.yml when a pull request touches HTML tooling or pages (ci.yml owns the
# path list, so this check can feed the always-present required check). Can also be
# run by hand from the Actions tab.
#
# The Node suites and the page checks are independent, so they run as separate jobs side by
# side: the suites in shards (`node --test --test-shard`, which splits the suite files
# round-robin), the teaching pages in another. The call fails if any job fails. ci.yml passes
# the suites and pages a pull request's changes can affect (`all`, a list, or `none`); a manual
# run checks everything.
on:
  workflow_call:
    inputs:
      suites:
        description: Space-separated suite files, `all`, or `none`
        type: string
        default: all
      shards:
        description: JSON list of shard numbers for the suites
        type: string
        default: '[1, 2]'
      pages:
        description: Space-separated teaching pages, `all`, or `none`
        type: string
        default: all
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    # Teaching pages and their tooling only need Linux; exercises are the cross-platform
    # part of the repo (docs/adr/0010-platform-support.md).
    if: inputs.suites != 'none'
    name: suites (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1, 2]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      # Playwright's browser download, keyed by the locked Playwright version. The setup below
      # still runs in full; it skips the download when the browser is already there.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('setup/package-lock.json') }}
      - name: Reproduce the documented Linux setup
        run: node setup/html-pages.mjs --with-system-deps
      - name: Node suites
        env:
          SUITES: ${{ inputs.suites || 'all' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -euo pipefail
          if [ "$SUITES" = all ]; then
            npm --prefix setup test -- --test-shard="$SHARD"
          else
            read -ra files <<<"$SUITES"
            node --test --test-shard="$SHARD" "${files[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-page-review-suites-${{ matrix.shard }}
          path: artifacts/html-pages/
          retention-days: 7
          if-no-files-found: ignore

  pages:
    if: inputs.pages != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('setup/package-lock.json') }}
      - name: Reproduce the documented Linux setup
        run: node setup/html-pages.mjs --with-system-deps
      - name: Teaching pages
        env:
          PAGES: ${{ inputs.pages || 'all' }}
        run: |
          set -euo pipefail
          if [ "$PAGES" = all ]; then
            npm --prefix setup run check-repo
          else
            read -ra chosen <<<"$PAGES"
            node tools/html-pages/check-repo-pages.mjs "${chosen[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-page-review
          path: artifacts/html-pages/
          retention-days: 7
