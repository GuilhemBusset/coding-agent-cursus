name: Engine tests

# Called by ci.yml on every pull request; its result feeds the single required check. Tests the
# implement loop engine (tools/implementation-loop/, ADR 0008 and 0012). The engine is standard
# library only and its tests are unittest test cases; pytest runs them here so pytest-xdist can
# spread them over every core. pytest is needed anyway: some tests check how the verifier treats
# pytest results.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A cache restore that GitHub throttles ("Egress is over the account limit") gives up after a
# minute and the job installs without it, instead of waiting the default 10 minutes.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A verifier test runs pytest through `uv run --offline`: uv must be installed and its cache
      # must already hold the pinned pytest, or that test skips.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - name: Warm uv's cache with the pinned pytest
        run: uv run --no-project --with pytest==8.3.5 python -c 'import pytest'

      # A doctor test compares setup/browser-libs.py with Playwright's own Chromium package list,
      # which it reads from the locked npm packages (no browser is installed).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setup/package-lock.json
      - name: Install the locked npm packages
        run: npm --prefix setup ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Engine tests
        run: |
          python -m pip install --quiet pytest==8.3.5 pytest-xdist==3.8.0 execnet==2.1.2
          python -m pytest -q -n auto -p no:cacheprovider --junitxml="$RUNNER_TEMP/engine.xml" tools/implementation-loop/tests

      # Everything the tests need is installed above, so a skip here means lost coverage.
      - name: Every collected test ran, none skipped
        run: |
          python3 - "$RUNNER_TEMP/engine.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "skipped")}
          print(totals)
          if totals["tests"] == 0 or totals["skipped"]:
              sys.exit("Empty or skipped engine test run: install what the skipped test needs.")
          EOF
