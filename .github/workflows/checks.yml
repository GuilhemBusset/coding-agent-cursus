name: Repo checks

# Called by ci.yml on every pull request; its result feeds the single required check.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ship skill is checked in twice (Claude Code reads .claude/skills/,
      # Codex reads .agents/skills/ — no converged directory exists yet). The
      # two copies must never drift.
      - name: Ship skill copies are byte-identical
        run: diff -u .agents/skills/ship/SKILL.md .claude/skills/ship/SKILL.md

      - name: HTML page skill copies are byte-identical
        run: diff -u .agents/skills/html-page/SKILL.md .claude/skills/html-page/SKILL.md

      - name: Implement skill copies are byte-identical
        run: diff -u .agents/skills/implement/SKILL.md .claude/skills/implement/SKILL.md

      # Acceptance checks the implement loop committed stay untouched on their branch.
      - name: Loop-locked acceptance checks unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-loop-guard.sh "$BASE" "$HEAD"

      - name: Shell syntax
        run: bash -n scripts/*.sh setup/*.sh .githooks/pre-commit .githooks/pre-push

      - name: JSON validity
        run: jq . setup/pr-only-main.json > /dev/null

      # Repeated publication must never need --force: see scripts/test-ship.sh.
      - name: Ship script behavior
        run: bash scripts/test-ship.sh

      # The implement loop engine: standard library only; pytest is needed only for the tests
      # that check how the verifier treats pytest results.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Implement loop engine tests
        run: |
          python -m pip install --quiet pytest==8.3.5
          python -m unittest discover -s tools/implementation-loop/tests -t tools/implementation-loop/tests
