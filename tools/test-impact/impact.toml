# Which checks a change can affect (docs/adr/0013-test-tiers-and-selection.md).
#
# scripts/check-changed.sh and CI's `changes` job run only the checks whose paths a change
# touches; every push to main and a nightly run still run everything. Patterns are matched
# against repo-relative paths: `*` stays inside one directory, `**` crosses directories.
#
# The map can only err by being too narrow, so it errs wide: a changed path that no pattern
# below matches runs everything, a Node suite with no entry runs on every change, and a
# deleted or renamed file counts under its old path too. When a test starts reading a new
# file, add that file here (tools/test-impact/test_impact.py checks the map against the repository).

[all]
# A change here runs every check.
paths = [
  ".github/workflows/**",
  ".github/scripts/**",
  ".gitignore",
  "tools/test-impact/**",
  "scripts/check-changed.sh",
  "setup/package.json",
  "setup/package-lock.json",
  "setup/html-pages.mjs",
]

[none]
# Read by no check: prose and editor configuration.
paths = [
  "AGENTS.md",
  "README.md",
  "CLAUDE.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "SECURITY.md",
  "docs/*.md",
  "docs/session-02/*.md",
  "docs/adr/**",
  "setup/*.md",
  "tools/html-pages/research.md",
]

# The skill copies, shell syntax and JSON steps of checks.yml: seconds, and always run in CI.
[units.repo-config]
paths = [".agents/skills/**", ".claude/skills/**", "scripts/*.sh", "setup/*.sh", "setup/*.json", ".githooks/**"]

[units.ship]
paths = ["scripts/ship.sh", "scripts/test-ship.sh", ".githooks/**"]

# tests/turn_in runs the turn-in script and hooks against temporary repositories, and reads the
# rulesets, their apply script and the turn-in skill's invocation settings.
[units.turn-in]
paths = [
  "tests/turn_in/**",
  "scripts/turn-in.sh",
  ".githooks/**",
  "setup/apply-ruleset.sh",
  "setup/homework-branches.json",
  "setup/pr-only-main.json",
  ".agents/skills/turn-in/**",
  ".claude/skills/turn-in/**",
  "sessions/*/exercises/turn-in-check.sh",
]

# tests/sessions: the repository's rules for every session (ADR 0001): its Python imports nothing
# from outside the session, and its default install stays light.
[units.session-layout]
paths = ["tests/sessions/**", "sessions/**/*.py", "sessions/*/pyproject.toml", "sessions/**/*.pth"]

# The implement loop engine tests run ship.sh, the loop guard and the hooks for real, check
# setup/browser-libs.py against Playwright's package list, and plan against a few repo files.
[units.engine]
paths = [
  "tools/implementation-loop/**",
  "scripts/ship.sh",
  "scripts/check-loop-guard.sh",
  ".githooks/**",
  "setup/browser-libs.py",
  ".claude/skills/ship/SKILL.md",
  "docs/adr/0001-*",
  "docs/adr/0003-*",
  "tools/html-pages/GUIDE.md",
]

# The student setup (ADR 0015): tests/student_setup, and student-setup.yml, which runs the scripts
# for real on Linux containers, macOS and Windows. They read the scripts, their pins and docs, the
# hooks they activate, the floors in check_setup.py and every session's contract files.
[units.student-setup]
paths = [
  "setup/student/**",
  "setup/editor.py",
  "setup/editor.json",
  "tests/student_setup/**",
  "setup/session-01-fundamentals.sh",
  "setup/git-hooks.sh",
  ".githooks/**",
  "sessions/*/mise.toml",
  "sessions/*/pyproject.toml",
  "sessions/*/uv.lock",
  "sessions/*/exercises/check_setup.py",
]

# ty over the repository's own Python (ty.toml, ADR 0014), with the tool locked in setup/. Each
# session type-checks its own code with its pytest suite (below).
[units.typecheck]
paths = [
  "ty.toml",
  "setup/pyproject.toml",
  "setup/uv.lock",
  "setup/browser-libs.py",
  "setup/editor.py",
  "tools/implementation-loop/**",
  "tests/turn_in/**",
  "tests/sessions/**",
  "setup/student/*.py",
  "tests/student_setup/**",
]

# Ruff's import order over every Python file in the repository (ruff.toml), with the Ruff locked
# beside ty in setup/.
[units.imports]
paths = ["**/*.py", "ruff.toml", "setup/pyproject.toml", "setup/uv.lock"]

# Each session's pytest suite has two parts, each in its own folder and run on its own:
#   lessons  tests/lessons: what is taught live (cursus/: decks, teaching labs, demos, fixtures,
#            and the hub index.html);
#   labs     tests/labs: what students do on their own (exercises/: pre-work, labs, homework,
#            turn-in).
# A part runs when a session file matching its `reads` (relative to the session folder) or a repo
# path matching its `shared` changes. A session file neither part claims (its pyproject.toml,
# uv.lock, README.md...) runs both. A Node suite in tests/<part>/ is selected by [node] only.
# The session's type check (ty, from its `typecheck` group) runs when one of `types` changes.
[sessions]
types = ["**/*.py", "pyproject.toml", "uv.lock", "mise.toml"]

[sessions.parts.lessons]
# The evidence deck re-runs the P00 lab it quotes.
reads = ["cursus/**", "index.html", "tests/lessons/**", "exercises/p00-lab/**"]
shared = []

[sessions.parts.labs]
# test_home_turn_in.py runs the real turn-in script and hooks; test_editor_setup.py and
# test_p00_lab.py check the editor setup a student's installation and the exported lab carry
# (ADR 0016).
reads = ["exercises/**", "tests/labs/**", ".vscode/**"]
shared = [
  "scripts/turn-in.sh", ".githooks/**",
  "ty.toml", ".vscode/**", "setup/cursus.code-workspace", "setup/editor.py", "setup/editor.json",
  "sessions/*/pyproject.toml",
]

# check-page.mjs runs on a teaching page when the page changes or a file it references (src,
# href, data) changes, is deleted or renamed; on every page when one of these changes.
[pages]
shared = [
  "tools/html-pages/check-page.mjs",
  "tools/html-pages/check-repo-pages.mjs",
  "tools/html-pages/browser.mjs",
]

# Node suites: tools/html-pages/tests/<name>.test.mjs (the page tooling's own) and
# sessions/<NN>-*/tests/<part>/<name>.test.mjs (a session's lessons). A suite runs when its own file,
# one of its paths, or a shared path changes. A suite with no entry runs on every change.
[node]
shared = [
  "tools/html-pages/browser.mjs",
  "tools/html-pages/create-page.mjs",
  "tools/html-pages/tests/component-helpers.mjs",
  "tools/html-pages/tests/suites.mjs",
  "tools/html-pages/tests/run-all.mjs",
  "tools/html-pages/tests/run-suite.mjs",
  "setup/doctor.mjs",
]

[node.suites]
# Session 1 decks: the deck, and the recordings, fixtures and lab files it quotes.
opening-close = ["sessions/01-fundamentals/cursus/00-opening.html", "sessions/01-fundamentals/cursus/99-close.html"]
sampler = ["sessions/01-fundamentals/cursus/01-sampler.html", "sessions/01-fundamentals/cursus/labs/tokenizer.html", "sessions/01-fundamentals/cursus/fixtures/*.json"]
thinking = ["sessions/01-fundamentals/cursus/02-thinking.html", "sessions/01-fundamentals/cursus/demos/effort/**"]
agent = ["sessions/01-fundamentals/cursus/03-agent.html", "sessions/01-fundamentals/cursus/demos/agent/**", "sessions/01-fundamentals/cursus/fixtures/runs/**"]
evidence = ["sessions/01-fundamentals/cursus/04-evidence.html", "sessions/01-fundamentals/exercises/mini-homework/**"]
# Session 1 teaching labs: the lab and the files it is built from.
agent-loop = ["sessions/01-fundamentals/cursus/labs/agent-loop.html", "sessions/01-fundamentals/cursus/fixtures/runs/**", "sessions/01-fundamentals/cursus/demos/agent/**"]
attention = ["sessions/01-fundamentals/cursus/labs/attention.html", "sessions/01-fundamentals/cursus/fixtures/attention.json"]
context = ["sessions/01-fundamentals/cursus/labs/context.html", "sessions/01-fundamentals/cursus/demos/effort/**"]
next-token = ["sessions/01-fundamentals/cursus/labs/next-token.html", "sessions/01-fundamentals/cursus/fixtures/next_token.json"]
test-time-compute = ["sessions/01-fundamentals/cursus/labs/test-time-compute.html"]
tiny-lm = ["sessions/01-fundamentals/cursus/labs/tiny-lm.html", "sessions/01-fundamentals/cursus/labs/tiny-lm/**"]
tokenizer = ["sessions/01-fundamentals/cursus/labs/tokenizer.html", "sessions/01-fundamentals/cursus/fixtures/next_token.json"]
verifier-gaming = ["sessions/01-fundamentals/cursus/labs/verifier-gaming.html"]
world-model = ["sessions/01-fundamentals/cursus/labs/world-model.html"]
# The page tooling: the shared components page, the templates and assets, the checker.
components-a11y = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/assets/**"]
components-tooling = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/templates/**", "tools/html-pages/assets/**"]
formula-slider = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/templates/**", "tools/html-pages/assets/**"]
predict = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/assets/**"]
probability-chart = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/templates/**", "tools/html-pages/assets/**"]
stepper = ["sessions/01-fundamentals/cursus/demos/components.html", "tools/html-pages/templates/**", "tools/html-pages/assets/**"]
pages = ["tools/html-pages/check-page.mjs", "tools/html-pages/templates/**", "tools/html-pages/assets/**"]
browser-env = ["setup/browser-libs.py"]
